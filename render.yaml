services:
  - type: web
    name: kd-kangen-water-api
    env: node
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: cron
    name: kd-kangen-water-keepalive
    env: node
    schedule: "*/10 * * * *"
    buildCommand: cd server && npm install
    startCommand: curl -fsS https://kd-kangen-water.onrender.com/api/health || exit 1
